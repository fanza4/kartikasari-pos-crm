<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular Paths for Curved Text -->
    <!-- Top Arc Path -->
    <path id="topTextArc" d="M 65,250 A 185,185 0 0,1 435,250" fill="none" />
    <!-- Bottom Arc Path (Clockwise along lower arc) -->
    <path id="bottomTextArc" d="M 435,250 A 185,185 0 0,1 65,250" fill="none" />
    <!-- Gradient for luxury gold feel -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Forest Green Circle -->
  <circle cx="250" cy="250" r="240" fill="#166534" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Outer Gold Ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#EAB308" stroke-width="3" />
  
  <!-- Middle Separator Gold Ring -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="#EAB308" stroke-width="4.5" />
  
  <!-- Inner Background Circle -->
  <circle cx="250" cy="250" r="145" fill="#14532D" />

  <!-- Top Arched Text: MIE BASO & ANEKA JUS -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="4">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      MIE BASO &amp; ANEKA JUS
    </textPath>
  </text>

  <!-- Gold Circular Separators -->
  <circle cx="68" cy="250" r="12" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="432" cy="250" r="12" fill="#EAB308" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- Bottom Arched Text: KARTIKA SARI -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="7">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      KARTIKA SARI
    </textPath>
  </text>

  <!-- Center Monogram "KS" with signature swoosh -->
  <g transform="translate(250, 250)" text-anchor="middle">
    <!-- Stylized "KS" Lettering -->
    <text x="-4" y="52" font-family="'Times New Roman', 'Georgia', serif" font-size="160" font-weight="900" fill="#FFFFFF" letter-spacing="-6">KS</text>
    <!-- Elegant Ribbon/Swoosh beneath the K & S -->
    <path d="M -105,42 Q -45,15 0,38 T 88,58 C 55,72 15,62 -25,48 Q -75,34 -105,42 Z" fill="#EAB308" opacity="0.9" />
    <path d="M -90,52 Q -40,30 5,48 T 85,68 C 50,78 15,70 -20,58 Q -65,46 -90,52 Z" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
