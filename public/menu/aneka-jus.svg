<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background Badge -->
  <rect width="200" height="200" rx="24" fill="#FEFCE8"/>
  <!-- Juice Glass -->
  <path d="M 62,65 L 75,165 Q 100,172 125,165 L 138,65 Z" fill="#FEF08A" stroke="#CA8A04" stroke-width="3" opacity="0.8"/>
  <!-- Avocado / Mango Green-Gold Juice Gradient -->
  <defs>
    <linearGradient id="jusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>
  <path d="M 65,82 L 76,162 Q 100,168 124,162 L 135,82 Z" fill="url(#jusGrad)"/>
  <!-- Chocolate Condensed Milk Swirl on Avocado Juice (Signature Indonesian style) -->
  <path d="M 78,92 Q 105,108 122,96 Q 100,130 84,142" stroke="#451A03" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- Straw -->
  <path d="M 120,25 L 98,115" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
  <!-- Fresh Fruit Accents -->
  <circle cx="58" cy="148" r="16" fill="#F97316" stroke="#C2410C" stroke-width="1.5"/>
  <circle cx="145" cy="145" r="14" fill="#65A30D" stroke="#365314" stroke-width="1.5"/>
</svg>
